name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@johmara'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages has no SPA fallback: serving index.html as 404.html lets deep links like /explore/phone load.
      - name: SPA fallback
        run: cp dist/dfm/browser/index.html dist/dfm/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/dfm/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
